name: Daily Stock Update

on:
  schedule:
    - cron: '30 13 * * 1-5'   # Market open  9:30am ET
    - cron: '5 20 * * 1-5'    # Market close 4:05pm ET
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stock prices and generate report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TYPE: ${{ (github.event.schedule == '5 20 * * 1-5') && 'close' || 'open' }}
        run: python fetch_stocks.py

      - name: Commit and push report
        run: |
          git config user.email "88954557+allie0132@users.noreply.github.com"
          git config user.name "allie0132"
          git add daily-reports/ index.html
          git diff --staged --quiet || git commit -m "report: stock update $(date +%Y-%m-%d-%H%M)"
          git push
